name: main

on:
  pull_request:
    branches: [ '*' ]
  push:
    branches: [ 'master', 'develop' ]

concurrency: ci-${{ github.ref }}

jobs:

  test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: test
        uses: pre-commit/action@v3.0.0

  # Verify the CDK app synthesizes for both environments. No AWS credentials
  # needed: the stack is environment-agnostic and does no context lookups, and
  # the Lambda's Docker image is only built at deploy time, not at synth time.
  synth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fct_stack: [ dev, prod ]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup-python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: setup-node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: install-cdk-cli
        run: npm install -g aws-cdk@2.1139.0

      - name: install-deps
        run: pip install -r requirements.txt

      - name: synth
        run: cdk synth --context fct_stack=${{ matrix.fct_stack }}

  build-dev:
    if: ${{ github.ref_name == 'develop' }}
    needs: synth
    uses: ./.github/workflows/build.yaml
    with:
      fct_stack: dev
      role_to_assume: arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse

  build-prod:
    if: ${{ github.ref_name == 'master' }}
    needs: synth
    uses: ./.github/workflows/build.yaml
    with:
      fct_stack: prod
      role_to_assume: arn:aws:iam::325565585839:role/sagebase-github-oidc-sage-bionetworks-synapse
